version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pr_reviewer_postgres
    environment:
      POSTGRES_USER: prreviewer
      POSTGRES_PASSWORD: prreviewer
      POSTGRES_DB: prreviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prreviewer -d prreviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
